<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<script>
// An invitation must leave the address bar before any other inline boot work can reach storage,
// theme state, analytics, navigation, or a module request. It lives only in this JS realm until
// the receiver consumes it; malformed fragments are discarded without exposing their contents.
(function () {
  var win = window, location = win.location, fragment = '';
  try { fragment = String(location.hash || ''); } catch (_) { return; }
  if (fragment.slice(0, 8) !== '#invite=') return;
  var candidate = fragment.slice(8);
  var value = /^[A-Za-z0-9_-]{43}$/.test(candidate) ? { token: candidate } : { invalid: true };
  try { win.history.replaceState(null, '', location.pathname + location.search); }
  catch (_) { try { location.hash = ''; } catch (_) {} }
  try { Object.defineProperty(win, '__opengymInvitation', { value: value, configurable: true }); }
  catch (_) { try { win.__opengymInvitation = value; } catch (_) {} }
})();
</script>
<script>
  // Set direction before first paint so an Arabic profile never flashes as LTR.
  // The app re-applies this on every language change (lib/i18n.js setLang).
  // i18n-core RTL_LANGS is the runtime source of truth — keep this list in sync.
  try {
    var s = JSON.parse(localStorage.getItem('gym_state_v1') || '{}');
    var l = s.lang || ((navigator.language || '').slice(0, 2) === 'ar' ? 'ar' : 'en');
    document.documentElement.lang = l;
    document.documentElement.dir = l === 'ar' ? 'rtl' : 'ltr';
  } catch (e) {}
  // Boot watchdog. A chunk this browser cannot parse (1.4.2's regex lookbehind on iOS 15.5 to
  // 16.3) kills the module graph before any of the app runs, and the logo lifted forever. Here,
  // outside the bundle and in plain old syntax, so it still runs then: a script that fails to
  // load or parse, or no app after 10 s, puts the reason and a Reload button where the logo was.
  // English only, as the packs are in the bundle that did not load. lib/boot.js removes #boot
  // (message included) once the app draws, so a slow start that gets there still gets there.
  (function () {
    var shown = false, last = '';
    function fail(title, detail) {
      var b = document.getElementById('boot');
      // Too early for the boot screen (a script in <head>): say it once the page is there.
      if (!b && document.readyState === 'loading') return document.addEventListener('DOMContentLoaded', function () { fail(title, detail); });
      if (shown || !b || b.getAttribute('data-leaving')) return;
      shown = true;
      b.className = 'fail';
      b.removeAttribute('aria-hidden');
      b.setAttribute('role', 'alert');
      b.setAttribute('dir', 'ltr');
      b.innerHTML = '';
      var box = document.createElement('div'), h = document.createElement('p'), p = document.createElement('p');
      h.className = 'h';
      h.textContent = title;
      p.textContent = 'Reloading often helps. If it keeps happening, please send us this:';
      var c = document.createElement('code');
      c.textContent = (detail || 'No error, it just never finished loading.') + ' (' + navigator.userAgent + ')';
      var r = document.createElement('button');
      r.type = 'button';
      r.textContent = 'Reload';
      r.onclick = function () { location.reload(); };
      box.appendChild(h); box.appendChild(p); box.appendChild(c); box.appendChild(r);
      b.appendChild(box);
    }
    window.addEventListener('error', function (e) {
      var t = e && e.target;
      if (t && t.tagName === 'SCRIPT') return fail('JohnGym could not start on this browser.', 'Could not load ' + (t.src || 'a script'));
      if (!e || !e.message) return;
      last = e.message + (e.filename ? ' at ' + e.filename.split('/').pop() + ':' + e.lineno : '');
      if (/SyntaxError|Unexpected|Invalid regular expression/i.test(e.message)) fail('JohnGym could not start on this browser.', last);
    }, true);
    window.addEventListener('unhandledrejection', function (e) {
      var r = e && e.reason;
      if (r) last = String((r && r.message) || r);
    });
    setTimeout(function () {
      fail(last ? 'JohnGym could not start on this browser.' : 'JohnGym is taking too long to start.', last);
    }, 10000);
  })();
</script>
<title>JohnGym</title>
<meta name="description" content="Personal gym & body weight tracker">
<meta name="theme-color" content="#07003c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="JohnGym">
<!-- use-credentials: browsers fetch the manifest without cookies, even same-origin; behind an auth
     proxy (Authelia, Cloudflare Access, Teleport…) that fetch is a login redirect and the Home Screen
     icon comes out generic. iOS 26 reads the icon from the manifest, so this is where it shows. -->
<link rel="manifest" href="manifest.json" crossorigin="use-credentials">
<link rel="apple-touch-icon" href="johngym-v1-180.png">
<link rel="icon" type="image/png" href="johngym-v1-180.png">
</head>
<body>
<!-- Text-only boot screen; lib/boot.js removes it when the app draws. -->
<style>
  #boot{position:fixed;inset:0;z-index:2147483000;display:grid;place-items:center;background:#07003c;transition:opacity .22s ease-out}
  #boot.out{opacity:0;pointer-events:none}
  #boot .wait{font:700 34px/1.2 system-ui,sans-serif;letter-spacing:-.04em;color:#ffffff}
  #boot .wait span{color:#ffad2f}
  #boot.fail{place-items:center;padding:24px}
  #boot.fail div{max-width:340px;font:15px/1.4 -apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;color:#ffffff;text-align:center}
  #boot.fail .h{font-size:19px;font-weight:600;margin:0 0 8px}
  #boot.fail code{display:block;margin:14px 0 18px;padding:10px;border-radius:10px;background:#1d0b6b;color:#c3bce8;font-size:12px;text-align:left;word-break:break-word;-webkit-user-select:text;user-select:text}
  #boot.fail button{font:inherit;font-weight:600;color:#07003c;background:#ffad2f;border:0;border-radius:12px;min-height:44px;padding:0 28px}
</style>
<div id="boot" aria-hidden="true">
  <div class="wait">John<span>Gym</span></div>
</div>
<div id="root"></div>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
